<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Pizzeria Bella Napoli</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #33251f;
            line-height: 1.6;
        }

        header {
            background: #762f20;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            color: #f5d8b5;
        }

        nav {
            background: #542116;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffc77d;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .categoria {
            margin-bottom: 40px;
        }

        .categoria h2 {
            color: #762f20;
            border-bottom: 2px solid #d9ad80;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .prodotto {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px dashed #dbcbbd;
        }

        .prodotto h3 {
            font-size: 1.1rem;
        }

        .descrizione {
            color: #78665b;
            font-size: 0.9rem;
        }

        .prezzo {
            color: #762f20;
            font-weight: bold;
            white-space: nowrap;
            font-size: 1.05rem;
        }

        footer {
            background: #762f20;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8rem;
            }

            nav a {
                margin: 0 7px;
                font-size: 0.9rem;
            }

            main {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🍕 PIZZERIA BELLA NAPOLI</h1>
        <p>Tradizione italiana dal 1985</p>
    </header>

    <nav>
        <a href="#pizze">Pizze</a>
        <a href="#dolci">Dolci</a>
        <a href="#bevande">Bevande</a>
    </nav>

    <main>
        
        <!-- SEZIONE BEVANDE -->
        <section class="categoria" id="bevande">
            <h2>🥤 Le bevande</h2>

            <div class="prodotto">
                <div>
                    <h3>Acqua</h3>
                    <p class="descrizione">50 cl</p>
                </div>
                <span class="prezzo">€ 1,50</span>
            </div>

            <div class="prodotto">
                <div>
                    <h3>Limonata</h3>
                    <p class="descrizione">33 cl</p>
                </div>
                <span class="prezzo">€ 2,50</span>
            </div>

            <div class="prodotto">
                <div>
                    <h3>Caffè</h3>
                    <p class="descrizione">Caffè italiano</p>
                </div>
                <span class="prezzo">€ 1,20</span>
            </div>

            <div class="prodotto">
                <div>
                    <h3>Fanta</h3>
                    <p class="descrizione">Aranciata di Margaglio</p>
                </div>
                <span class="prezzo">€ 200</span>
            </div>
        </section>

    </main>

</body>
</html>
